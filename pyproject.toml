[project]
name = "personal-chief"
version = "0.1.0"
description = "Personal Chief - 私厨助手 API"
readme = "knowledge.txt"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "langchain-core>=0.3.0",
    "langchain-tavily>=0.1.0",
    "langchain-openai>=0.2.0",
    "langgraph-checkpoint>=2.0.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "alibabacloud-oss-v2>=0.1.0",
    "aiohttp>=3.9.0",
    "ipykernel>=7.3.0",
]

[project.optional-dependencies]
dev = [
    "ipython>=8.0.0",
    "pytest>=8.0.0",
]

[tool.uv]
dev-dependencies = [
    "ipython>=8.0.0",
    "pytest>=8.0.0",
]

[tool.uv.sources]
